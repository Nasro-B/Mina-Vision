<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; pointer-events: none; }
    #cursor { position: fixed; transform: translate(-8px, -8px); color: #fff; font: 600 12px/1.2 system-ui, sans-serif; filter: drop-shadow(0 2px 5px rgba(0,0,0,.5)); }
    #dot { width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; background: var(--mina-color); box-shadow: 0 0 0 2px var(--mina-color); }
    #label { display: inline-block; margin: 5px 0 0 9px; padding: 4px 7px; border-radius: 7px; background: var(--mina-color); white-space: nowrap; }
  </style>
</head>
<body>
  <div id="cursor" hidden><div id="dot"></div><div id="label"></div></div>
  <script>
    globalThis.renderMinaCursor = ({ x, y, name, decision }) => {
      const cursor = document.querySelector('#cursor');
      const color = decision === 'confirm' ? '#f59e0b' : decision === 'block' ? '#ef4444' : '#7c3aed';
      cursor.style.left = `${x}px`;
      cursor.style.top = `${y}px`;
      cursor.style.setProperty('--mina-color', color);
      document.querySelector('#label').textContent = `Mina · ${name}`;
      cursor.hidden = false;
      return true;
    };
  </script>
</body>
</html>
